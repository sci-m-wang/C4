[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c4-bench"
version = "0.1.0"
description = "Core construction and evaluation code for Chengyu-based C4 Bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ccb-build = "ccb.build_all:main"
ccb-apply-manual-scenes = "ccb.manual_scenes:main"
ccb-export-hf = "ccb.export_hf:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
